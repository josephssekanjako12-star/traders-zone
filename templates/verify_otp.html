<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verify OTP</title>
    <style>
        body { background-color: #0a0e17; color: #e1e1e1; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: #111827; padding: 30px; border-radius: 15px; border: 1px solid #2d3748; width: 100%; max-width: 400px; }
        h2 { color: #00ffaa; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2d3748; background: #0a0e17; color: white; font-size: 16px; box-sizing: border-box; text-align: center; letter-spacing: 5px; }
        button { width: 100%; padding: 14px; background: #00ffaa; color: #0a0e17; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .error { color: #ff4d4d; text-align: center; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Enter OTP</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <p style="text-align: center; color: #a0aec0; margin-bottom: 20px; font-size: 14px;">Check your iSH terminal for the 6-digit code.</p>
        <form method="POST">
            <input type="text" name="otp" placeholder="000000" maxlength="6" required>
            <button type="submit">Verify Code</button>
        </form>
    </div>
</body>
</html>
