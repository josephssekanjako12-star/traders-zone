{% extends "base.html" %}

{% block nav_left %}
    <a href="/chats" style="color: #00ffaa; text-decoration: none; margin-right: 15px; font-size: 20px;"><i class="fa-solid fa-arrow-left"></i></a>
    <span style="font-size: 20px; font-weight: bold; color: #e1e1e1;">New Chat</span>
{% endblock %}

{% block content %}
<div class="container" style="margin-top: 20px;">
    <h3 style="color: #a0aec0; margin-bottom: 15px;">Select a trader to message:</h3>
    
    {% for u in users %}
        <a href="/chat_room/{{ u.username }}" style="display: flex; align-items: center; padding: 15px; text-decoration: none; color: inherit; background: #111827; border-radius: 10px; margin-bottom: 10px; border: 1px solid #2d3748;">
            {% if u.avatar_path %}
                <img src="/{{ u.avatar_path }}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 15px;">
            {% else %}
                <div style="width: 40px; height: 40px; border-radius: 50%; background: #00ffaa; color: #0a0e17; display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px;">{{ u.username[0] }}</div>
            {% endif %}
            <div style="font-weight: bold; font-size: 16px;">@{{ u.username }}</div>
        </a>
    {% endfor %}
</div>
{% endblock %}
