<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0e17; color: #e1e1e1; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: #111827; padding: 30px; border-radius: 15px; border: 1px solid #2d3748; width: 100%; max-width: 400px; }
        h2 { color: #00ffaa; text-align: center; margin-bottom: 20px; }
        .form-group { position: relative; margin-bottom: 15px; }
        input { width: 100%; padding: 12px 40px 12px 15px; border-radius: 8px; border: 1px solid #2d3748; background: #0a0e17; color: white; font-size: 16px; box-sizing: border-box; }
        .eye-icon { position: absolute; right: 15px; top: 14px; color: #a0aec0; cursor: pointer; }
        button { width: 100%; padding: 14px; background: #00ffaa; color: #0a0e17; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Set New Password</h2>
        <form method="POST">
            <div class="form-group">
                <input type="password" name="password" id="new-pwd" placeholder="Enter new password" required>
                <i class="fa-solid fa-eye eye-icon" id="eye-icon" onclick="togglePwd()"></i>
            </div>
            <button type="submit">Update Password</button>
        </form>
    </div>

    <script>
        function togglePwd() {
            const pwd = document.getElementById('new-pwd');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
