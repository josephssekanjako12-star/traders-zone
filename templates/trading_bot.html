{% extends "base.html" %}

{% block nav_left %}
    <span style="font-size: 20px; font-weight: bold; color: #00ffaa;">Trading Bot</span>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    
    <!-- Wallet Stats -->
    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
        <div style="flex: 1; background: #111827; padding: 15px; border-radius: 10px; border: 1px solid #2d3748;">
            <div style="color: #a0aec0; font-size: 12px;">USDT Balance</div>
            <div id="usdt-bal" style="color: #00ffaa; font-size: 24px; font-weight: bold;">$0.00</div>
        </div>
        <div style="flex: 1; background: #111827; padding: 15px; border-radius: 10px; border: 1px solid #2d3748;">
            <div style="color: #a0aec0; font-size: 12px;">Coin Balance</div>
            <div id="coin-bal" style="color: #00ffaa; font-size: 24px; font-weight: bold;">0.00</div>
        </div>
    </div>

    <!-- Bot Status -->
    <div style="background: #111827; padding: 20px; border-radius: 10px; border: 1px solid #2d3748; margin-bottom: 20px;">
        <h3 style="color: #e1e1e1; margin-bottom: 10px;">Status: <span id="bot-status" style="color: #00ffaa;">Scanning</span></h3>
        <p style="color: #a0aec0; font-size: 14px;">Active Coin: <span id="active-coin" style="color: white;">None</span></p>
        <p style="color: #a0aec0; font-size: 14px;">Current Price: <span id="current-price" style="color: white;">0.00</span></p>
    </div>

    <div id="grid-display" style="display: none; margin-top: 15px;">
    <p style="color: #a0aec0; font-size: 14px; margin-bottom: 5px;">Active Grid Lines:</p>
    <div id="grid-lines" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
    </div>

    <!-- Logs -->
    <div style="background: #111827; padding: 20px; border-radius: 10px; border: 1px solid #2d3748;">
        <h3 style="color: #e1e1e1; margin-bottom: 15px;">Bot Activity Log</h3>
        <div id="bot-logs" style="display: flex; flex-direction: column; gap: 10px; font-family: monospace; font-size: 13px;">
            <!-- Logs will go here -->
        </div>
    </div>
</div>

<script>
    function updateDashboard() {
        fetch('/api/bot_status')
            .then(res => res.json())
            .then(data => {
                // Check if data exists before trying to use it
                if (!data || !data.usdt_balance) return; 
                
                document.getElementById('usdt-bal').innerText = '$' + data.usdt_balance.toFixed(2);
                document.getElementById('coin-bal').innerText = data.coin_balance.toFixed(4);
                document.getElementById('bot-status').innerText = data.status;
                document.getElementById('active-coin').innerText = data.active_coin;
                document.getElementById('current-price').innerText = data.last_price ? data.last_price.toFixed(8) : "0.00";

                // Change status color based on mode
                if(data.status === "Trading") {
                    document.getElementById('bot-status').style.color = "#00ffaa";
                } else {
                    document.getElementById('bot-status').style.color = "#a0aec0";
                }

                let logContainer = document.getElementById('bot-logs');
                logContainer.innerHTML = '';
                data.logs.forEach(log => {
                    let div = document.createElement('div');
                    div.style.color = log.includes("[BUY]") ? "#00ffaa" : (log.includes("[SELL]") ? "#ff4d4d" : "#a0aec0");
                    div.innerText = "> " + log;
                    logContainer.appendChild(div);
                });

                // p                if (data.status === "Trading" && data.grids.length > 0) {
                    document.getElementById('grid-display').style.display = 'block';
                    let gridContainer = document.getElementById('grid-lines');
                    gridContainer.innerHTML = '';
                    data.grids.forEach(price => {
                        let span = document.createElement('span');
                        span.style.background = "#111827";
                        span.style.padding = "5px 10px";
                        span.style.borderRadius = "5px";
                        span.style.border = "1px solid #2d3748";
                        span.style.fontSize = "12px";
                        span.innerText = price.toFixed(8);
                        gridContainer.appendChild(span);
                    });
                } else {
                    document.getElementById('grid-display').style.display = 'none';
                }
            });
    }

    // Fetch immediately, then every 5 seconds
    updateDashboard();
    setInterval(updateDashboard, 5000);
</script>
{% endblock %}
